<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>ismail live</title>
<style>
:root{--bg:#0b0b0e;--card:#16161c;--line:#26262f;--fg:#ececf1;--dim:#9a9aa8;--acc:#7dd3a8;--love:#ff6b8b;--rec:#ff4d4d;--warn:#f5c060}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 18px);max-width:520px;margin:0 auto;user-select:none}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;min-height:52px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.row3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#555;margin-right:6px;vertical-align:1px}
.live .dot{background:var(--acc)}
.chip{padding:3px 9px;border-radius:99px;border:1px solid var(--line);font-size:12px;white-space:nowrap}
.chip.rec{border-color:var(--rec);color:var(--rec)}
.now{font-size:20px;font-weight:600;margin:12px 0 2px;min-height:26px}
.next{color:var(--dim);font-size:14px;min-height:19px}
.last{font-size:15px;margin:8px 0;padding-left:10px;border-left:3px solid var(--acc)}
.last small{color:var(--dim)}
#startset{width:100%;margin:8px 0;border-color:#2f5444}
.pinned{background:#1b2420;border:1px solid #2d4a3c;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.play{display:flex;gap:10px;align-items:center;margin:14px 0}
#play{flex:1;min-height:64px;font-size:20px;font-weight:600;background:#1d2a24;border-color:#2f5444}
#back,#golive{min-width:74px;font-size:14px;color:var(--dim)}
#talk{width:100%;min-height:120px;border-radius:24px;font-size:22px;font-weight:700;background:#1e1c2c;border-color:#3b3560;margin:4px 0 2px}
#talk.on{background:#4a1520;border-color:var(--rec);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,77,77,.15)}}
.hint{font-size:12px;color:var(--dim);text-align:center;min-height:16px}
#love{border-color:#5a2a38;color:var(--love);font-weight:600}
#change{font-weight:600}
.mood button{min-height:44px;font-size:14px;padding:8px 4px}
.mood button.sel{border-color:var(--acc);color:var(--acc)}
#agentbtns:empty{display:none}
#agentbtns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
#agentbtns button{flex:1 1 40%}
h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:18px 0 6px;font-weight:600}
.feed div{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.feed small{color:var(--dim)}
.offer{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.offer a{color:var(--acc);text-decoration:none;font-weight:600;padding:8px 12px;border:1px solid var(--line);border-radius:10px}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:18px;font-size:12px;color:var(--dim)}
.foot button{min-height:36px;padding:6px 10px;font-size:12px;border-radius:10px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#22222b;border:1px solid var(--line);padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;font-size:14px;z-index:9}
#toast.show{opacity:1}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:8}
#sheet.show{display:flex}
#panel{background:#15151b;border-top:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:520px;margin:0 auto;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow:auto}
#panel h2{margin:0 0 6px;font-size:19px}
#panel p{margin:0 0 12px;color:#cfcfda;white-space:pre-wrap}
#panel img{max-width:100%;border-radius:10px;margin-bottom:10px}
.btns{display:grid;gap:10px}
.clip{border:1px solid var(--line);border-radius:14px;padding:10px;margin:0 0 10px}
.clip .playclip{width:100%;font-size:18px;font-weight:700}
.clip.playing .playclip{border-color:var(--acc);color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{min-height:36px;padding:6px 10px;font-size:13px;border-radius:99px}
.chips button.sel,.choice.sel{border-color:var(--acc);color:var(--acc);background:#18251f}
textarea{width:100%;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;min-height:64px;margin:6px 0 12px}
.warn{color:var(--warn)}
</style>
</head>
<body>
<div class="top" id="top"><span id="livestate"><span class="dot"></span><span id="livetext">connecting</span></span><span class="chip" id="rec">rec ?</span></div>
<div class="now" id="now">&nbsp;</div>
<div class="next" id="next"></div>
<div class="pinned" id="pinned" hidden></div>
<div class="last" id="last" hidden></div>
<button id="startset" hidden>Ask the DJ to start a set</button>

<div class="play">
  <button id="back" aria-label="back 30 seconds">&#8634; 30s</button>
  <button id="play">&#9654; Listen</button>
  <button id="golive">Live</button>
</div>

<button id="talk">Hold to talk</button>
<div class="hint" id="talkhint">tap once to talk hands-free, tap again to send</div>

<div class="row"><button id="love">&#9829; Love this</button><button id="change">&#10227; Change it up</button></div>
<div class="row"><button data-tap="energy_down">&minus; Calmer</button><button data-tap="energy_up">More energy +</button></div>
<div class="row"><button data-tap="quieter">Quieter</button><button data-tap="louder">Louder</button></div>
<div class="row"><button data-tap="pause">&#10073;&#10073; Pause set</button><button data-tap="resume">&#9654; Resume set</button></div>
<div class="row3 mood" id="mood"><button data-mood="calm">calm</button><button data-mood="steady">steady</button><button data-mood="lift">lift</button><button data-mood="peak">peak</button></div>
<div id="agentbtns"></div>

<div id="offerbox" hidden><h3>Downloads</h3><div id="offers"></div></div>
<h3>From the DJ</h3>
<div class="feed" id="feed"><div><small>nothing yet</small></div></div>

<div class="foot">
  <span id="listening">no agent listening</span>
  <span><button id="quality">64 kbps</button> <button id="buzzset">buzz on</button></span>
</div>

<div id="sheet"><div id="panel"></div></div>
<div id="toast"></div>
<audio id="audio" preload="none"></audio>
<script src="app.js"></script>
</body>
</html>
