name: publish

# Cut a release by pushing a tag that matches the version in pyproject.toml and server.json, e.g. v0.3.0.
# One-time setup: on PyPI add a trusted publisher for this repo (workflow publish.yml, environment pypi).
# The MCP Registry step signs in with GitHub OIDC, so it needs no secret.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$tag\"" pyproject.toml
          python -c "import json,sys; d=json.load(open('server.json')); sys.exit(0 if d['version']==d['packages'][0]['version']=='$tag' else 1)"
      - name: build
        run: pip install build && python -m build
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: publish to the MCP Registry
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # PyPI can take a minute to serve a new release; the registry checks it exists
          for i in 1 2 3 4 5; do ./mcp-publisher publish && exit 0; sleep 30; done; exit 1
