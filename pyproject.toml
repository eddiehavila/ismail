[project]
name = "ismail"
version = "0.1.0"
description = "An agent-operated DAW: text in, audio as text out, with an MCP server"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "numba>=0.60",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pyloudnorm>=0.1",
    "matplotlib>=3.8",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
perceptual = ["torch>=2.2", "transformers>=4.40"]
separate = ["demucs>=4.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ismail", "ismail.voices"]

[tool.setuptools.package-data]
"ismail.voices" = ["*.json"]
